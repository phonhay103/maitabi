[project]
name = "maitabi-mcp-server"
version = "0.3.0"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "phonhay103", email = "phonhay103@users.noreply.github.com" }
]
keywords = ["mcp", "fastmcp", "maitabi", "bus-tour", "japan-travel", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.29.0",
    "httpx>=0.27.0",
    "fastmcp>=3.4.5",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/phonhay103/maitabi-mcp-server"
Repository = "https://github.com/phonhay103/maitabi-mcp-server"
"Docker Hub" = "https://hub.docker.com/r/phonhay103/maitabi-mcp-server"

[project.scripts]
maitabi-mcp-server = "maitabi_mcp_server.mcp.server:main"
maitabi = "maitabi_mcp_server.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Supply-chain lag: a release must be 7 days old before the resolver may pick
# it. Malicious or broken uploads are usually yanked within hours, so waiting
# turns the registry's own recall into our safety net. Relative on purpose —
# it is re-evaluated at every lock, not frozen to one date.
exclude-newer = "7 days"

