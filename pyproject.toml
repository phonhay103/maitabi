[project]
name = "maitabi"
version = "1.1.0"
description = "Maitabi (unofficial): bus tours, trekking tours and calendars as a CLI, an MCP server, and agent skills"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "phonhay103", email = "phonhay103@users.noreply.github.com" }
]
keywords = ["mcp", "fastmcp", "maitabi", "bus-tour", "japan-travel", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.29.0",
    "httpx>=0.27.0",
    "fastmcp>=3.4.5",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/phonhay103/maitabi"
Repository = "https://github.com/phonhay103/maitabi"
"Docker Hub" = "https://hub.docker.com/r/phonhay103/maitabi"

[project.scripts]
maitabi = "maitabi.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# docs/ and skills/ hold generated Markdown (docs/TOOL_CATALOG.md and the two
# filter-mapping.md copies, written by scripts/gen_catalog.py). Former ruff
# versions only formatted Python; newer ones also reformat Python code blocks
# inside Markdown, which would silently fight the generator and fail
# `make catalog-check`. Keep the formatter away from anything it does not own.
extend-exclude = ["docs", "skills"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "ANN",   # flake8-annotations (prevent Any via ANN401)
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify (simplify logic)
    "RUF",   # Ruff specific rules
]
ignore = [
    "ANN002", # Do not require type annotation for *args
    "ANN003", # Do not require type annotation for **kwargs
    "ANN401", # Dynamically typed expressions (typing.Any) are allowed

    # --- Resolve conflicts with Formatter ---
    "COM812", # Ignore missing trailing comma warnings (handled by formatter)
    "ISC002", # Ignore implicit string concatenation warnings

    # --- Design philosophy optimizing ruff format ---
    "E501",   # Ignore line length limit (delegated to ruff format)
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["maitabi"]

[tool.ruff.lint.per-file-ignores]
# Allow assert in testing, relax type annotation requirements
"tests/**/*.py" = ["S101", "S105", "S106", "ANN", "ARG", "E402", "SIM117", "RUF059"]

# Protect package initialization files from unused imports (keep exported imports)
"__init__.py" = ["F401"]

# Relax checks for build/generator scripts
"scripts/**/*.py" = ["SIM", "ARG", "ANN"]

[tool.ty]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Supply-chain lag: a release must be 7 days old before the resolver may pick
# it. Malicious or broken uploads are usually yanked within hours, so waiting
# turns the registry's own recall into our safety net. Relative on purpose —
# it is re-evaluated at every lock, not frozen to one date.
exclude-newer = "7 days"

