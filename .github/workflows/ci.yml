name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Run offline test suite
        run: uv run pytest tests/ -v

      - name: Build package
        run: uv build

      - name: Check generated catalog is up to date
        run: uv run python scripts/gen_catalog.py --check
